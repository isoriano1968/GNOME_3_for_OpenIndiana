    HAL's own policy (hal.conf) allows the Volume and Storage interfaces
    (Mount, Unmount, Eject) only at_console, and OpenIndiana's dbus is built
    without a console auth directory, so at_console is never true and only
    root can mount or unmount removable media through HAL: the desktop's
    eject button fails.  Allow them for group staff, OpenIndiana's default
    group for users.  HAL still checks the RBAC authorization
    solaris.device.mount.removable for each call.
-->
<busconfig>
  <policy group="staff">
    <allow send_interface="org.freedesktop.Hal.Device.Volume"
           send_destination="org.freedesktop.Hal"/>
    <allow send_interface="org.freedesktop.Hal.Device.Storage"
           send_destination="org.freedesktop.Hal"/>
  </policy>
</busconfig>
